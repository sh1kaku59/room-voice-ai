[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "__pyrefly_virtual__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length
    "E402",  # module level import not at top of file
    "B008",
    "B010",  # setattr on module stub
    "B904",
    "SIM105",
    "SIM108",
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "configs"]

[tool.pyrefly]
python-version = "3.12"
search-path = [
    ".",
    "src",
]
site-package-path = [
    "C:/Users/wanbi/AppData/Local/Programs/Python/Python312/Lib/site-packages",
]
python-interpreter-path = "C:/Users/wanbi/AppData/Local/Programs/Python/Python312/python.exe"
permissive-ignores = true


